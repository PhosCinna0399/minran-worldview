<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的书架</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    /* ===== 登录 ===== */
    #login {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      gap: 12px;
    }
    #login h2 { margin: 0 0 8px; font-weight: 500; }
    #login input {
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 280px;
      outline: none;
    }
    #login input:focus { border-color: #888; }
    #login button {
      padding: 10px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: #fff;
      cursor: pointer;
    }
    #err { color: #d33; font-size: 14px; display: none; }

    /* ===== 书架 ===== */
    #app { display: none; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 12px 20px;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e5e5e5;
    }
    .topbar .title { font-weight: 600; font-size: 16px; }

    .shelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 20px 80px;
    }

    .book-card {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform .15s;
    }
    .book-card:hover { transform: translateY(-3px); }

    .cover {
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 8px;
      overflow: hidden;
      background: #ddd;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      color: #fff;
      text-align: center;
      padding: 10px;
      line-height: 1.4;
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .book-title {
      margin-top: 10px;
      font-size: 14px;
      text-align: center;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <!-- 登录 -->
  <div id="login">
    <h2>请输入密码</h2>
    <input id="pwd" type="password" placeholder="密码" autofocus>
    <button onclick="check()">进入</button>
    <p id="err">密码错误，再试试</p>
  </div>

  <!-- 书架 -->
  <div id="app">
    <div class="topbar">
      <span class="title">我的书架</span>
    </div>

    <div class="shelf">
      <!-- ===== 每本书一个卡片，以后加书复制这一段 ===== -->
      <a class="book-card" href="book1.html">
        <div class="cover" style="background:#5b6abf;">
          <!-- 有封面图就换成：<img src="covers/book1.jpg" alt=""> -->
          测试书封面
        </div>
        <div class="book-title">测试书（先看效果）</div>
      </a>
      <!-- ===== 加书就复制上面这段，改 href、颜色、书名 ===== -->

    </div>
  </div>

  <script>
    const PASSWORD = '980714CitrusJunos020924WatermelonBy120718MinnLan';

    function check() {
      const pwd = document.getElementById('pwd').value;
      if (pwd === PASSWORD) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        sessionStorage.setItem('loggedIn', '1');
      } else {
        document.getElementById('err').style.display = 'block';
      }
    }
    document.getElementById('pwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') check();
    });

    // 如果已经登录过，直接进书架
    if (sessionStorage.getItem('loggedIn') === '1') {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }
  </script>

</body>
</html>
