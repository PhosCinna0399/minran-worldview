<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书架</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f7f7f7; color: #222; }
    #login { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; gap: 12px; }
    #login h2 { margin: 0 0 8px; font-weight: 500; }
    #login input { padding: 10px 14px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; width: 280px; outline: none; }
    #login input:focus { border-color: #888; }
    #login button { padding: 10px 24px; font-size: 16px; border: none; border-radius: 8px; background: #333; color: #fff; cursor: pointer; }
    #err { color: #d33; font-size: 14px; display: none; }
    #app { display: none; }
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; padding: 12px 20px; background: rgba(255,255,255,.9); backdrop-filter: blur(8px); border-bottom: 1px solid #e5e5e5; }
    .topbar .title { font-weight: 600; font-size: 16px; }
    .shelf { max-width: 800px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .book-card { text-decoration: none; color: inherit; display: flex; gap: 16px; background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05); transition: transform .15s, box-shadow .15s; }
    .book-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    .cover { width: 80px; height: 106px; flex-shrink: 0; border-radius: 6px; overflow: hidden; color: #fff; display: flex; justify-content: center; align-items: center; font-size: 12px; text-align: center; padding: 6px; }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .book-title { font-size: 16px; font-weight: 600; margin: 0 0 8px 0; line-height: 1.4; }
    .book-meta { font-size: 13px; color: #777; margin: 0; }
  </style>
</head>
<body>
  <div id="login">
    <h2>请输入密码</h2>
    <input id="pwd" type="password" placeholder="密码" autofocus>
    <button onclick="check()">进入</button>
    <p id="err">密码错误，再试试</p>
  </div>
  <div id="app">
    <div class="topbar">
      <span class="title">书架</span>
    </div>
    <div class="shelf">
      <!-- 第1本 -->
      <a class="book-card" href="book1.html">
        <div class="cover"><img src="covers/cover1.jpg" alt="封面"></div>
        <div class="info">
          <h3 class="book-title">存而不论 旧章</h3>
          <p class="book-meta">作者：cn岷蓝ミンラン · 连载中</p>
        </div>
      </a>
      <!-- 第2本 -->
      <a class="book-card" href="book2.html">
        <div class="cover" style="background:#c06b6b;">封面</div>
        <div class="info">
          <h3 class="book-title">番外篇：孤独新生？</h3>
          <p class="book-meta">作者：cn岷蓝ミンラン · 连载中</p>
        </div>
      </a>
      <!-- 第3本 -->
      <a class="book-card" href="book3.html">
        <div class="cover" style="background:#6b9c6b;">封面</div>
        <div class="info">
          <h3 class="book-title">联动篇：架空の魔法少女✴ミランor未藍</h3>
          <p class="book-meta">作者：cn岷蓝ミンラン · 连载中</p>
        </div>
      </a>
      <!-- 第4本 -->
      <a class="book-card" href="book4.html">
        <div class="cover" style="background:#c09f6b;">封面</div>
        <div class="info">
          <h3 class="book-title">存而不论 新编</h3>
          <p class="book-meta">作者：cn岷蓝ミンラン · 连载中</p>
        </div>
      </a>
      <!-- 第5本 -->
      <a class="book-card" href="book5.html">
        <div class="cover" style="background:#8c6bc0;">封面</div>
        <div class="info">
          <h3 class="book-title">新编人物番外篇：无花果轻病</h3>
          <p class="book-meta">作者：cn岷蓝ミンラン · 连载中</p>
        </div>
      </a>
    </div>
  </div>
  <script>
    const PASSWORD = '980714CitrusJunos020924WatermelonBy120718MinnLan';
    function check() {
      const pwd = document.getElementById('pwd').value;
      if (pwd === PASSWORD) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        sessionStorage.setItem('loggedIn', '1');
      } else {
        document.getElementById('err').style.display = 'block';
      }
    }
    document.getElementById('pwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') check();
    });
    if (sessionStorage.getItem('loggedIn') === '1') {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }
  </script>
</body>
</html>
