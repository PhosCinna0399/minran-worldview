<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试书</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e5e5e5;
    }
    .topbar button, .topbar a {
      padding: 6px 14px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      text-decoration: none;
      color: #222;
    }
    .topbar .title { font-weight: 600; font-size: 15px; flex: 1; }

    /* ===== 改成大封面区域 ===== */
    .book-header {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center; /* 居中 */
      text-align: center;
      gap: 16px;
    }
    
    /* 大封面 */
    .book-header .cover {
      width: 200px;
      height: 266px;
      border-radius: 12px;
      background: #5b6abf;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
      overflow: hidden;
    }
    .book-header .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .book-header .info h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    .book-header .info p {
      margin: 0;
      font-size: 14px;
      color: #777;
    }

    .layout {
      display: flex;
      max-width: 1100px;
      margin: 0 auto;
    }

    #toc {
      width: 240px;
      flex-shrink: 0;
      padding: 16px 8px 80px;
      border-right: 1px solid #e5e5e5;
      position: sticky;
      top: 49px;
      height: calc(100vh - 49px);
      overflow-y: auto;
      background: #fafafa;
    }
    #toc h3 {
      margin: 0 0 10px;
      padding: 0 10px;
      font-size: 13px;
      color: #888;
      font-weight: 500;
    }
    #toc a {
      display: block;
      padding: 8px 10px;
      font-size: 14px;
      color: #333;
      text-decoration: none;
      border-radius: 6px;
      line-height: 1.4;
    }
    #toc a:hover { background: #eee; }
    #toc a.active { background: #333; color: #fff; }

    #content {
      flex: 1;
      min-width: 0;
      padding: 32px 24px 120px;
      line-height: 1.9;
      font-size: 17px;
    }
    #content h1 {
      font-size: 22px;
      margin: 48px 0 20px;
      padding-top: 8px;
    }
    #content h1:first-child { margin-top: 0; }
    #content p { margin: 0 0 1.2em; text-indent: 2em; }

    @media (max-width: 720px) {
      #toc {
        position: fixed;
        left: 0;
        top: 49px;
        height: calc(100vh - 49px);
        z-index: 9;
        transform: translateX(-100%);
        transition: transform .25s;
        box-shadow: 2px 0 12px rgba(0,0,0,.1);
        width: 260px;
      }
      #toc.open { transform: translateX(0); }
      #content { padding: 24px 16px 120px; }
      .book-header { padding: 24px 16px 16px; }
      .book-header .cover { width: 160px; height: 213px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="index.html">← 书架</a>
    <button onclick="toggleToc()">目录</button>
    <span class="title" id="bookTitle">测试书</span>
    <button onclick="saveBookmark()">加书签</button>
  </div>

  <!-- 大封面展示区 -->
  <div class="book-header">
    <div class="cover" style="background:#5b6abf;">
      <!-- 以后有图就换成：<img src="covers/book1.jpg" alt=""> -->
      封面
    </div>
    <div class="info">
      <h1>测试书</h1>
      <p>作者：cn岷蓝ミンラン · 状态：连载中</p>
    </div>
  </div>

  <div class="layout">
    <nav id="toc">
      <h3>目录</h3>
    </nav>
    <main id="content"></main>
  </div>

  <script>
    if (sessionStorage.getItem('loggedIn') !== '1') {
      location.href = 'index.html';
    }

    fetch('book1_content.html')
      .then(r => r.text())
      .then(html => {
        const content = document.getElementById('content');
        content.innerHTML = html;

        const headings = content.querySelectorAll('h1, h2');
        const toc = document.getElementById('toc');
        headings.forEach((h, i) => {
          const id = 'sec-' + i;
          h.id = id;
          const a = document.createElement('a');
          a.href = '#' + id;
          a.textContent = h.textContent;
          a.dataset.target = id;
          a.addEventListener('click', e => {
            e.preventDefault();
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
            if (window.innerWidth <= 720) toc.classList.remove('open');
          });
          toc.appendChild(a);
        });

        restoreBookmark();
        window.addEventListener('scroll', highlightToc);
        highlightToc();
      });

    function highlightToc() {
      const links = document.querySelectorAll('#toc a');
      let current = null;
      links.forEach(a => {
        const el = document.getElementById(a.dataset.target);
        if (el && el.getBoundingClientRect().top <= 100) current = a;
      });
      links.forEach(a => a.classList.remove('active'));
      if (current) current.classList.add('active');
    }

    const BOOK_KEY = 'bookmark_book1';

    function saveBookmark() {
      const links = document.querySelectorAll('#toc a');
      let current = null;
      links.forEach(a => {
        const el = document.getElementById(a.dataset.target);
        if (el && el.getBoundingClientRect().top <= 100) current = a;
      });
      if (current) {
        localStorage.setItem(BOOK_KEY, current.dataset.target);
        alert('已保存书签：' + current.textContent);
      } else {
        alert('还没开始读呢');
      }
    }

    function restoreBookmark() {
      const saved = localStorage.getItem(BOOK_KEY);
      if (saved) {
        const el = document.getElementById(saved);
        if (el) setTimeout(() => el.scrollIntoView({ behavior: 'auto' }), 50);
      }
    }

    function toggleToc() {
      document.getElementById('toc').classList.toggle('open');
    }
  </script>

</body>
</html>
